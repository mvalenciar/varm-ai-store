[project]
name = "backend"
version = "0.1.0"
description = "Motor de Tienda Virtual con Agente de IA y Cotizador Inteligente"
readme = "README.md"
authors = [
    { name = "Milton Valencia R", email = "miltonalonsovalenciarincon@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.143.2",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.16.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
